<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Midnight Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- KHUNG BACKGROUND NỀN RỒNG -->
    <canvas id="canvas"></canvas>
    <div class="moon"></div>

    <!-- THANH MENU TRÊN CÙNG -->
    <header class="navbar">
        <div class="logo-container">
            <img src="loggoo.jpg" alt="Logo Midnight Club" class="logo-img">
            <span class="logo-text">MIDNIGHT CLUB</span>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="members.html" class="btn-member">Thành Viên Nhóm</a></li>
            </ul>
        </nav>
    </header>

    <!-- KHU VỰC FORM ĐĂNG KÝ -->
    <!-- Tui thêm margin-top xíu đặng nó khỏi bị dính vô cái menu -->
    <main class="join-section" style="margin-top: 120px;">
        <h2 class="section-title">Gia Nhập <span class="highlight">Midnight Club</span></h2>
        
        <form action="https://formspree.io/f/xkoybkwj" method="POST" class="join-form">
            <input type="text" name="Tên" placeholder="Tên hoặc Biệt danh của bro là gì?" required>
            <input type="email" name="Email" placeholder="Để lại Link Facebook đặng tụi tui liên hệ nghen" required>
            <textarea name="Lý_Do" placeholder="Kể nghe thử sao bro muốn vô Midnight Club?..." rows="5" required></textarea>
            
            <button type="submit" class="btn-primary">Gửi Đơn Xin Vô Nhóm</button>
        </form>
    </main>

    <!-- GỌI HIỆU ỨNG RA -->
    <script src="script.js"></script>
</body>
</html>
